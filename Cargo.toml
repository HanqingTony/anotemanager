[workspace]
resolver = "2"
members = [
    "crates/anm-core",
    "crates/anm-cli",
    "crates/anm-tray-core",
    "crates/anm-tray-win",
]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
