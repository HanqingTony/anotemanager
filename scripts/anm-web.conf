# anm 统一入口（单端口 18101）：
#   /            → anm-web 前端页面（静态）
#   /api/ipc     → anm-core 人机 HTTP API（127.0.0.1:17373）
#   /mcp         → MCP HTTP（127.0.0.1:17371，SSE 需关缓冲）
server {
    listen 192.168.0.102:18101;
    root /var/www/anm-web;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/ipc {
        proxy_pass http://127.0.0.1:17373;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:17373;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:17371;
        proxy_http_version 1.1;
        # rmcp 只认回环 Host（防 DNS rebinding）
        proxy_set_header Host 127.0.0.1:17371;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
