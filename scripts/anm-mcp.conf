# anm MCP 入口：LAN 访问 192.168.0.102:17372/mcp → 127.0.0.1:17371/mcp
# MCP 服务本身只绑回环（readme §17）；nginx 作为 LAN 入口，
# 只绑内网地址 + 仅允许内网段，不向公网暴露。
server {
    listen 192.168.0.102:17372;
    allow 192.168.0.0/24;
    deny all;

    location /mcp {
        proxy_pass http://127.0.0.1:17371;
        proxy_http_version 1.1;
        # rmcp 只接受回环 Host（防 DNS rebinding）——转发时改回回环
        proxy_set_header Host 127.0.0.1:17371;
        proxy_set_header X-Real-IP $remote_addr;
        # MCP streamable HTTP 走 SSE：必须关缓冲、长超时，否则流被截断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
