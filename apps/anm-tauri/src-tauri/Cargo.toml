[package]
name = "anm-tauri"
version = "0.1.0"
description = "anm-tray Tauri 版：透明全屏覆盖层 + 托盘 + 热键 + TCP 转发"
edition = "2021"

# 独立 workspace：不并入根 workspace（避免与 anm-core 等成员互相牵连）
[workspace]

[lib]
name = "anm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# 注：windows-sys 0.59 中 ShellExecuteExW/SHELLEXECUTEINFOW 挂在
# Win32_System_Registry feature 下（命名反直觉，以源码 cfg 为准）
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
