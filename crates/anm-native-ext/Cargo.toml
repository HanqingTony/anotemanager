[package]
name = "anm-native-ext"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
serde_json = "1"
tungstenite = "0.21"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
